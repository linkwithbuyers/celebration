<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Happy Birthday, Jerri!</title>
<meta property="og:title" content="Happy Birthday, Jerri!">
<meta property="og:description" content="I recorded a little something for you.">
<meta property="og:image" content="poster.jpg">
<meta property="og:video" content="Jerri.mp4">
<meta property="og:video:secure_url" content="Jerri.mp4">
<meta property="og:video:type" content="video/mp4">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #6d28d9, #db2777, #f59e0b, #6d28d9);
    background-size: 400% 400%;
    animation: party 16s ease infinite;
    color: #fff;
    overflow-x: hidden;
  }
  @keyframes party {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .confetti {
    position: fixed;
    top: -20px;
    width: 10px; height: 16px;
    opacity: .85;
    animation: fall linear infinite;
    z-index: 0;
    border-radius: 2px;
  }
  .confetti.c1 { left: 5%;  background:#fbbf24; animation-duration: 7s;   animation-delay: 0s;   }
  .confetti.c2 { left: 15%; background:#34d399; animation-duration: 9s;   animation-delay: 2s;   width:8px;  height:8px;  border-radius:50%; }
  .confetti.c3 { left: 25%; background:#60a5fa; animation-duration: 8s;   animation-delay: 4s;   }
  .confetti.c4 { left: 35%; background:#f472b6; animation-duration: 10s;  animation-delay: 1s;   width:12px; height:12px; border-radius:50%; }
  .confetti.c5 { left: 45%; background:#f87171; animation-duration: 7.5s; animation-delay: 3s;   }
  .confetti.c6 { left: 55%; background:#fbbf24; animation-duration: 9.5s; animation-delay: 5s;   width:8px;  height:8px;  border-radius:50%; }
  .confetti.c7 { left: 65%; background:#34d399; animation-duration: 8.5s; animation-delay: 2.5s; }
  .confetti.c8 { left: 75%; background:#60a5fa; animation-duration: 10s;  animation-delay: .5s;  }
  .confetti.c9 { left: 85%; background:#f472b6; animation-duration: 7s;   animation-delay: 4.5s; width:12px; height:12px; border-radius:50%; }
  .confetti.c10{ left: 95%; background:#f87171; animation-duration: 9s;   animation-delay: 1.5s; }
  @keyframes fall {
    0%   { transform: translateY(-5vh) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(720deg); }
  }
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 64px;
    text-align: center;
  }
  h1 { font-size: 30px; margin: 0 0 8px; text-shadow: 0 2px 12px rgba(0,0,0,.35); }
  p.sub { margin: 0 0 26px; font-size: 16px; color: rgba(255,255,255,.9); text-shadow: 0 1px 6px rgba(0,0,0,.3); }
  .card {
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 22px;
    padding: 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 18px 50px rgba(0,0,0,.25);
  }
  video { width: 100%; border-radius: 14px; background: #000; display: block; }
  .cta {
    display: inline-block;
    margin-top: 26px;
    padding: 13px 30px;
    border-radius: 999px;
    background: #fbbf24;
    color: #431407;
    font-weight: 800;
    text-decoration: none;
    font-size: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
  }
  .brand { margin-top: 34px; font-size: 12px; color: rgba(255,255,255,.75); letter-spacing: .1em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="confetti c1"></div><div class="confetti c2"></div><div class="confetti c3"></div>
<div class="confetti c4"></div><div class="confetti c5"></div><div class="confetti c6"></div>
<div class="confetti c7"></div><div class="confetti c8"></div><div class="confetti c9"></div>
<div class="confetti c10"></div>

<div class="wrap">
  <h1>&#127874; Happy Birthday, Jerri! &#127881;</h1>
  <p class="sub">I recorded a little something for you.</p>

  <div class="card">
    <video controls playsinline preload="metadata" poster="poster.jpg" src="Jerri.mp4"></video>
  </div>

  <a class="cta" href="https://hellobyvideo.com">Send a video like this</a>

  <div class="brand">sent via HelloByVideo</div>
</div>
</body>
</html>
